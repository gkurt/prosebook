core:changelogs:
  - content: "---\npackages:\n  prosebook:\n    type: minor\n---\n\n### The inspector's shortcut can be changed\n\n`inspect: { modifiers: ['Control', 'Shift'], button: 'right' }` on any integration holds other keys to show each string's key, and\npresses another button to edit it. The keys are held exactly, so Alt-click no longer opens the inspector with Shift or Control also\nheld.\n"
    filename: inspector-shortcut.md
    v: 0.0.0
