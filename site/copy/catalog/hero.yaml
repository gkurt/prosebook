# yaml-language-server: $schema=./catalog.schema.json
hero.title:
  kind: description
  surface: title
  context: The headline at the top of the page.
  en: Every word in your app, written well.

hero.lead:
  kind: description
  surface: hint
  context: Under the headline, what prosebook does.
  en: prosebook keeps the copy in one typed catalog and holds every string to your writing rules, with a lint, a judge, and a CLI an agent can drive.

hero.copy:
  kind: action
  surface: action
  context: The button beside the command in the hero, which copies the command.
  en: Copy

hero.copied:
  kind: state
  surface: detail
  context: Replaces the copy button's text for a moment once the command is copied.
  en: Copied

hero.docs:
  kind: action
  surface: action
  context: A link beside the command in the hero to the API reference.
  en: Read the docs

hero.try:
  kind: description
  surface: hint
  context: Under the command in the hero, which lints the text in the visitor's own code with nothing installed.
  en: Run the command in any codebase. Nothing is installed or set up, and no file is written.
