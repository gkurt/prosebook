# yaml-language-server: $schema=./catalog.schema.json
playground.eyebrow:
  kind: name
  surface: label
  context: The small line above the heading of the playground, where a visitor edits a catalog and sees what it compiles to.
  en: Playground

playground.title:
  kind: description
  surface: heading
  context: Heads the playground.
  en: Write a message, see what ships.

playground.intro:
  kind: description
  surface: hint
  context: Under the playground's heading, above an editor holding a catalog and a panel showing what it makes.
  en: 'The real compiler, lint and generators, running in this page. Edit the order page, in English or German:'

playground.files:
  kind: name
  surface: aria
  context: Names the buttons above the editor that switch between the catalog file and its German translation.
  en: Files

playground.outputs:
  kind: name
  surface: aria
  context: Names the buttons above the output panel that switch between the preview, the lint and the generated files.
  en: Output

playground.preview:
  kind: name
  surface: label
  context: The button that shows each message rendered in every locale, with a field for each placeholder.
  en: Preview

playground.lint:
  kind: name
  surface: label
  context: The button that shows the catalog's problems and the writing rules' findings.
  args:
    count: how many problems and findings there are
  en: '{count, plural, =0 {Lint} one {Lint (#)} other {Lint (#)}}'

playground.reset:
  kind: action
  surface: action
  context: In the editor's title bar. Puts back the files the playground started with.
  en: Reset

playground.fix:
  kind: action
  surface: action
  context: Beside a lint finding. Makes the edit the finding suggests in the file.
  en: Fix

playground.loading:
  kind: state
  surface: status
  context: Under the editor while the compiler downloads, before the first result.
  en: Loading the compiler…

playground.failed:
  kind: state
  surface: status
  context: Under the editor when the compiler could not be downloaded.
  args:
    reason: the error the browser gave
  en: "The compiler didn't load: {reason}"

playground.summary:
  kind: state
  surface: status
  context: Under the editor after each edit, says how much compiled.
  args:
    messages: how many messages the catalog holds
    locales: how many locales they were compiled in
  en: '{messages, plural, one {# message} other {# messages}} compiled in {locales, plural, one {# locale} other {# locales}}.'

playground.broken:
  kind: state
  surface: status
  context: Under the editor when an entry has an error and is left out of what compiled.
  args:
    count: how many problems there are
  en: '{count, plural, one {# problem leaves an entry out: see Lint.} other {# problems leave entries out: see Lint.}}'

playground.clean:
  kind: state
  surface: empty
  context: In the lint panel when nothing is wrong.
  en: Nothing to fix. The words pass the writing rules.

playground.fallback:
  kind: description
  surface: hint
  context: Shown on hover over a message that a locale doesn't translate, which shows in English instead.
  args:
    locale: the locale that lacks the translation
  en: Not translated in {locale}, so it shows in English.

playground.missing:
  kind: state
  surface: empty
  context: In place of a generated file that could not be written because of a problem in the catalog.
  en: Not generated. The lint says why.
