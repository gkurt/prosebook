# yaml-language-server: $schema=./catalog.schema.json
features.title:
  kind: name
  surface: heading
  context: Heads the section about the catalog, with types, translations and the inspector.
  en: One typed catalog

features.lead:
  kind: description
  surface: hint
  context: Under the heading of the section about the catalog.
  en: The words live in YAML, each with the context a translator needs, and the code holds only keys.

features.typed.title:
  kind: name
  surface: heading
  context: Heads the feature about types.
  en: Typed keys

features.typed.body:
  kind: description
  surface: hint
  context: Under the heading about types, beside a picture of an editor completing a key.
  en: A misspelled key or a missing argument is a type error, and completing a key shows the text behind the key.

features.stale.title:
  kind: name
  surface: heading
  context: Heads the feature about stale translations.
  en: Translations that keep up

features.stale.body:
  kind: description
  surface: hint
  context: Under the heading about translations, beside a picture of a source text changing.
  en: Change a source text, and each translation made from the old words is marked stale.

features.inspector.title:
  kind: name
  surface: heading
  context: Heads the feature about the inspector.
  en: Edits on the page

features.inspector.body:
  kind: description
  surface: hint
  context: Under the heading about the inspector, beside a picture of a page with each string's key shown.
  en: In dev, hold Alt to see the key behind each string. Alt-click a string to rewrite the entry in place.

features.inspector.here:
  kind: description
  surface: hint
  context: Under the inspector's description, on devices with a pointer, notes that the inspector runs on this page.
  en: This page runs the inspector too. Hold Alt over any text.
