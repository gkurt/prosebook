# yaml-language-server: $schema=./catalog.schema.json
features.types:
  kind: state
  surface: heading
  context: Over a code sample where a misspelled key and a missing argument fail to compile. Links to the docs on types.
  en: A wrong key doesn't compile

features.translations:
  kind: state
  surface: heading
  context: Over a translation marked stale, with the change to its source shown word by word. Links to the docs on stale translations.
  en: Translators see what changed

features.lint:
  kind: state
  surface: heading
  context: Over a lint finding on a message. Links to the docs on lint.
  en: Held to a writing guide

features.builds:
  kind: state
  surface: heading
  context: Over a sample of a build shipping each area's messages with the code reading them. Links to the docs on builds.
  en: Only what the code reads ships
