# yaml-language-server: $schema=./catalog.schema.json
inspect.hint:
  kind: description
  surface: hint
  context: Under the buttons below the headline. Every string on the page can be edited this way. The key is Alt, or Option on a Mac.
  args:
    key: the name of the key on the keyboard
    kbd: marks the key's name as a key
  en: Hold <kbd>{key}</kbd> and click any text on this page to edit it.

inspect.toggle:
  kind: action
  surface: action
  context: In the top bar. Turns on clicking a string to edit it, for those without a keyboard.
  en: Inspect

inspect.local:
  kind: description
  surface: hint
  context: At the foot of the dialog that edits a string of the page. Nothing is sent anywhere.
  en: Edits stay on this page.
