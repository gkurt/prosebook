# yaml-language-server: $schema=./catalog.schema.json
site.title:
  kind: name
  surface: title
  context: The page's title, in the browser tab and in search results.
  en: prosebook

site.description:
  kind: description
  surface: hint
  context: The page's meta description, under the title in search results and link previews.
  en: A typed catalog for every string an app shows, with a lint, a judge and a CLI that hold the writing to your rules.

site.home:
  kind: name
  surface: aria
  context: Names the logo in the top bar, which links to the top of the page.
  en: prosebook home

site.docs:
  kind: name
  surface: label
  context: A link in the top bar to the API reference.
  en: Docs

site.github:
  kind: name
  surface: label
  context: A link in the top bar and the footer to the repository on GitHub.
  en: GitHub

site.license:
  kind: name
  surface: label
  context: A link in the footer to the license file.
  en: MIT license

site.author:
  kind: name
  surface: label
  context: A link in the footer to the author's profile on X, by the author's handle on X.
  en: '@gkurttech'
