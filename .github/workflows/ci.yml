name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun i --frozen-lockfile
      # First: the examples import prosebook as an app does, from dist, and the type-aware lint reads them.
      - run: bun run build
      # What an app ships, minified and gzipped, against the budgets in the script.
      - run: bun run size
      - run: bun check
      # The README, API.md, CONTRIBUTING.md and AGENTS.md, held to the writing rules as the copy is.
      - run: bun run docs
      # And to the guidelines, by the judge, where the repo has the gateway's key; skipped where it hasn't, as in a fork.
      - run: bun run docs:judge
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      # The site's catalog and the Vite example's the same way; their lint runs in their own jobs.
      - run: bun run judge
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      - run: bun run test
      - run: bun typecheck

  # Each example against the package as built, the way a user runs it: its catalog is generated and
  # passes lint, it typechecks, its production build succeeds, and what it serves says what it should.
  examples:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [vite, preact, vue, svelte, solid, rspack, next, bun, tanstack-start, node]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      # Next and the Node example run under Node, which strips the types from `.ts` files.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: bun i --frozen-lockfile
      - run: bun run build
      # prosebook's bin exists only once built, so the examples are linked again to get it.
      - run: rm -rf examples/*/node_modules && bun i --frozen-lockfile
      - working-directory: examples/${{ matrix.example }}
        run: bun run check
      - working-directory: examples/${{ matrix.example }}
        run: bun run typecheck
      - working-directory: examples/${{ matrix.example }}
        run: bun run --if-present build
      - run: bun scripts/smoke.mts ${{ matrix.example }}

  # The homepage, an Astro app on the package as built: its catalog is generated and passes lint, it
  # typechecks, and it builds, as Pages builds it.
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun i --frozen-lockfile
      - run: bun run build
      # prosebook's bin exists only once built, so the site is linked again to get it.
      - run: rm -rf site/node_modules && bun i --frozen-lockfile
      - working-directory: site
        run: bun run check
      - working-directory: site
        run: bun run typecheck
      - working-directory: site
        run: bun run build
