<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>prosebook example</title>
    <style>
      :root {
        color-scheme: light dark;
        --fg: #1d1d1f;
        --muted: #6e6e73;
        --line: #d2d2d7;
        --bg: #fff;
        --card: #f5f5f7;
        --accent: #0a66ff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #f5f5f7;
          --muted: #a1a1a6;
          --line: #3a3a3c;
          --bg: #111;
          --card: #1c1c1e;
          --accent: #4d94ff;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          15px/1.5 system-ui,
          sans-serif;
        color: var(--fg);
        background: var(--bg);
      }
      main {
        max-width: 640px;
        margin: 0 auto;
        padding: 24px 16px;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }
      h1 {
        font-size: 22px;
        margin: 0;
      }
      h2 {
        font-size: 17px;
        margin: 0 0 4px;
      }
      label {
        display: flex;
        gap: 8px;
        align-items: center;
        color: var(--muted);
      }
      select,
      button {
        font: inherit;
        padding: 6px 12px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--bg);
        color: var(--fg);
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      section {
        background: var(--card);
        border-radius: 12px;
        padding: 16px;
        margin-top: 16px;
      }
      .muted {
        color: var(--muted);
      }
      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
        margin: 12px 0;
      }
      a {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
