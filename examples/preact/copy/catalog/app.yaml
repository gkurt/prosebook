# yaml-language-server: $schema=./catalog.schema.json
app.title:
  kind: name
  surface: title
  context: The app's name, in the header and the browser tab.
  en: Corner Shop

app.language:
  kind: name
  surface: label
  context: Labels the menu that switches the language of the app.
  en: Language

app.greeting:
  kind: state
  surface: status
  context: Greets the signed-in person at the top of the page.
  args:
    name: the person's first name
  en: Welcome back, {name}.

app.last-visit:
  kind: state
  surface: hint
  context: Under the greeting, the time of the person's last visit.
  args:
    when: the date and time of the last visit
  en: Your last visit was {when, date, medium} at {when, time, short}.

app.now:
  kind: state
  surface: hint
  context: What a time under a minute from now reads as, in place of "0 minutes ago", wherever the app shows how long ago something happened.
  args:
    tense: past, or future for a time just ahead
  fragment: true
  en: '{tense, select, future {in a moment} other {just now}}'
