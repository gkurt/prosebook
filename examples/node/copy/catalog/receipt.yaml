# yaml-language-server: $schema=./catalog.schema.json
receipt.title:
  kind: name
  surface: title
  context: Heads the receipt the shop prints at the till.
  en: Corner Shop

receipt.items:
  kind: state
  surface: status
  context: Under the title, counts what was bought.
  args:
    count: how many items were bought
  en: '{count, plural, =0 {Nothing bought.} one {# item bought.} other {# items bought.}}'

receipt.total:
  kind: state
  surface: status
  context: The sum of the receipt, on the receipt's last line.
  args:
    amount: the total price, in euros
  fragment: true
  en: 'Total: {amount, number, ::currency/EUR}'

receipt.printed:
  kind: state
  surface: hint
  context: Under the total, when the receipt was printed.
  args:
    when: the date and time the receipt was printed
  en: Printed on {when, date, long} at {when, time, short}.

receipt.thanks:
  kind: description
  surface: hint
  context: The last line of the receipt.
  en: Thanks for shopping with us.
